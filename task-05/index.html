<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керований лічильник</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        #timer {
            font-size: 2rem;
            margin: 20px;
            display: inline-block;
            min-width: 50px;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        #stop-btn {
            background-color: #f44336;
            color: white;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Керований лічильник</h1>
    <div>
        <span id="timer">0</span>
    </div>
    <div>
        <button id="start-btn">Старт</button>
        <button id="stop-btn" disabled>Стоп</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
